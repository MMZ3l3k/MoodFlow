<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Diagram przypadków użycia — MoodFlow</title>
<style>
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 30px 40px;
    background: #fff;
  }
  .figure-caption {
    text-align: center;
    font-style: italic;
    font-size: 13pt;
    margin-top: 20px;
    color: #333;
    font-family: Verdana, sans-serif;
  }
  svg { display: block; margin: 0 auto; background: #fff; }
</style>
</head>
<body>

<svg width="2200" height="1480" viewBox="0 0 2200 1480" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Hollow triangle marker (generalizacja UML) -->
    <marker id="gen" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,1 L13,7 L0,13 Z" fill="#fff" stroke="#5d50ad" stroke-width="1.5"/>
    </marker>
    <!-- Strzałka dla «extend» / «include» -->
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L12,6 L0,12" fill="none" stroke="#7a7a7a" stroke-width="1.5"/>
    </marker>
  </defs>

  <style>
    .system-box   { fill: #fff; stroke: #b8b8b8; stroke-width: 1.5; }
    .system-hdr   { fill: #b3d4f0; }
    .system-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 16pt; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .role-band    { fill: #f5f8fc; }
    .role-label   { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11pt; font-weight: bold; fill: #5d50ad; }
    .role-divider { stroke: #d0d0d0; stroke-width: 1; stroke-dasharray: 4,3; }

    .uc-oval      { fill: #eaf2f9; stroke: #5d8cb6; stroke-width: 1.5; }
    .uc-text      { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10.5pt; fill: #1a1a1a; text-anchor: middle; }

    .actor-line   { stroke: #1a1a1a; stroke-width: 2; fill: none; }
    .actor-head   { fill: #fff; stroke: #1a1a1a; stroke-width: 2; }
    .actor-label  { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12pt; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .actor-stereo { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10pt; font-style: italic; fill: #666; text-anchor: middle; }

    .assoc        { stroke: #7a7a7a; stroke-width: 1.5; fill: none; }
    .gen-line     { stroke: #5d50ad; stroke-width: 1.5; fill: none; }
    .extend-line  { stroke: #7a7a7a; stroke-width: 1.5; fill: none; stroke-dasharray: 6,4; }
    .stereo       { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9pt; font-style: italic; fill: #666; text-anchor: middle; }
  </style>

  <!-- ================== SYSTEM BOUNDARY ================== -->
  <g>
    <rect class="system-box" x="460" y="60" width="1480" height="1360" rx="6"/>
    <rect class="system-hdr"  x="460" y="60" width="1480" height="44" rx="6"/>
    <rect class="system-hdr"  x="460" y="80" width="1480" height="24"/>
    <text class="system-title" x="1200" y="90">MoodFlow — system monitorowania dobrostanu pracowników</text>
  </g>

  <!-- ================== STREFY RÓL (delikatne tła + etykiety) ================== -->
  <!-- Pracownik: y 130 — 460 -->
  <rect class="role-band" x="475" y="130" width="1450" height="320" rx="4"/>
  <text class="role-label" x="495" y="155">PRACOWNIK</text>
  <line class="role-divider" x1="475" y1="460" x2="1925" y2="460"/>

  <!-- HR: y 470 — 720 -->
  <rect class="role-band" x="475" y="470" width="1450" height="250" rx="4" fill="#fbfbfb"/>
  <text class="role-label" x="495" y="495">HR (PRACOWNIK DZIAŁU HR)</text>
  <line class="role-divider" x1="475" y1="730" x2="1925" y2="730"/>

  <!-- Administrator firmy: y 740 — 1060 -->
  <rect class="role-band" x="475" y="740" width="1450" height="320" rx="4"/>
  <text class="role-label" x="495" y="765">ADMINISTRATOR FIRMY</text>
  <line class="role-divider" x1="475" y1="1070" x2="1925" y2="1070"/>

  <!-- Właściciel platformy: y 1080 — 1400 -->
  <rect class="role-band" x="475" y="1080" width="1450" height="320" rx="4" fill="#fbfbfb"/>
  <text class="role-label" x="495" y="1105">WŁAŚCICIEL PLATFORMY (SUPER-ADMIN)</text>

  <!-- ================== USE CASES ================== -->
  <!-- helper: oval rx=160 ry=32, x_center, y_center -->

  <!-- ===== PRACOWNIK ===== -->
  <!-- col A x=720 -->
  <ellipse class="uc-oval" cx="720" cy="220" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="225">Logowanie / rejestracja</text>

  <ellipse class="uc-oval" cx="720" cy="300" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="293">Wypełnienie testu</text>
  <text class="uc-text" x="720" y="312">psychologicznego</text>

  <ellipse class="uc-oval" cx="720" cy="380" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="385">Przegląd własnych wyników</text>

  <!-- col B x=1100 -->
  <ellipse class="uc-oval" cx="1100" cy="220" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="218">Otrzymanie powiadomienia</text>
  <text class="uc-text" x="1100" y="236">o nowym teście</text>

  <ellipse class="uc-oval" cx="1100" cy="300" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="295">Edycja profilu</text>
  <text class="stereo" x="1100" y="312">«extension points»</text>

  <ellipse class="uc-oval" cx="1100" cy="380" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="385">Wylogowanie</text>

  <!-- col C x=1480 — extending UC -->
  <ellipse class="uc-oval" cx="1480" cy="300" rx="160" ry="32"/>
  <text class="uc-text" x="1480" y="295">Zmiana hasła</text>
  <text class="stereo" x="1480" y="312">«extend»</text>
  <!-- linia extend od Zmiana hasła → Edycja profilu -->
  <path class="extend-line" d="M 1320 300 L 1260 300" marker-end="url(#arrow)"/>

  <!-- ===== HR ===== -->
  <ellipse class="uc-oval" cx="720" cy="560" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="565">Logowanie HR</text>

  <ellipse class="uc-oval" cx="720" cy="640" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="635">Anonimowa analityka</text>
  <text class="uc-text" x="720" y="652">(k-anonimowość)</text>

  <ellipse class="uc-oval" cx="1100" cy="560" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="565">Filtrowanie po działach</text>

  <ellipse class="uc-oval" cx="1100" cy="640" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="635">Eksport raportu</text>
  <text class="uc-text" x="1100" y="652">CSV / PDF</text>

  <ellipse class="uc-oval" cx="1480" cy="560" rx="160" ry="32"/>
  <text class="uc-text" x="1480" y="565">Przegląd alertów wellbeing</text>

  <!-- ===== ADMINISTRATOR FIRMY ===== -->
  <ellipse class="uc-oval" cx="720" cy="830" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="835">Logowanie administratora</text>

  <ellipse class="uc-oval" cx="720" cy="910" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="915">Zaproszenie pracownika</text>

  <ellipse class="uc-oval" cx="720" cy="990" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="995">Zarządzanie pracownikami</text>

  <ellipse class="uc-oval" cx="1100" cy="830" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="827">Przypisanie testu</text>
  <text class="stereo" x="1100" y="844">«extension points»</text>

  <ellipse class="uc-oval" cx="1100" cy="910" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="915">Konfiguracja działów</text>

  <ellipse class="uc-oval" cx="1100" cy="990" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="985">Przegląd wyników</text>
  <text class="uc-text" x="1100" y="1002">firmy</text>

  <!-- col C — extend from Przypisanie testu -->
  <ellipse class="uc-oval" cx="1480" cy="830" rx="160" ry="32"/>
  <text class="uc-text" x="1480" y="827">Wybór działu docelowego</text>
  <text class="stereo" x="1480" y="844">«extend»</text>
  <path class="extend-line" d="M 1320 830 L 1260 830" marker-end="url(#arrow)"/>

  <!-- ===== WŁAŚCICIEL PLATFORMY ===== -->
  <ellipse class="uc-oval" cx="720" cy="1170" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="1175">Logowanie super-admin</text>

  <ellipse class="uc-oval" cx="720" cy="1250" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="1247">Akceptacja rejestracji</text>
  <text class="uc-text" x="720" y="1265">firm</text>

  <ellipse class="uc-oval" cx="720" cy="1340" rx="160" ry="32"/>
  <text class="uc-text" x="720" y="1345">Zarządzanie szablonami</text>

  <ellipse class="uc-oval" cx="1100" cy="1170" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="1167">Globalne statystyki</text>
  <text class="uc-text" x="1100" y="1185">platformy</text>

  <ellipse class="uc-oval" cx="1100" cy="1250" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="1255">Audit log systemu</text>

  <ellipse class="uc-oval" cx="1100" cy="1340" rx="160" ry="32"/>
  <text class="uc-text" x="1100" y="1337">Blokada / aktywacja</text>
  <text class="uc-text" x="1100" y="1355">firmy</text>

  <!-- ================== AKTORZY (LEFT SIDE) ================== -->
  <!-- Pracownik (y_center = 290) -->
  <g>
    <circle class="actor-head" cx="200" cy="240" r="14"/>
    <line class="actor-line" x1="200" y1="254" x2="200" y2="310"/>
    <line class="actor-line" x1="170" y1="270" x2="230" y2="270"/>
    <line class="actor-line" x1="200" y1="310" x2="175" y2="350"/>
    <line class="actor-line" x1="200" y1="310" x2="225" y2="350"/>
    <text class="actor-label" x="200" y="380">Pracownik</text>
  </g>

  <!-- HR (y_center = 600) -->
  <g>
    <circle class="actor-head" cx="200" cy="555" r="14"/>
    <line class="actor-line" x1="200" y1="569" x2="200" y2="625"/>
    <line class="actor-line" x1="170" y1="585" x2="230" y2="585"/>
    <line class="actor-line" x1="200" y1="625" x2="175" y2="665"/>
    <line class="actor-line" x1="200" y1="625" x2="225" y2="665"/>
    <text class="actor-label" x="200" y="695">HR</text>
  </g>

  <!-- Administrator firmy (y_center = 900) -->
  <g>
    <circle class="actor-head" cx="200" cy="855" r="14"/>
    <line class="actor-line" x1="200" y1="869" x2="200" y2="925"/>
    <line class="actor-line" x1="170" y1="885" x2="230" y2="885"/>
    <line class="actor-line" x1="200" y1="925" x2="175" y2="965"/>
    <line class="actor-line" x1="200" y1="925" x2="225" y2="965"/>
    <text class="actor-label" x="200" y="995">Administrator firmy</text>
  </g>

  <!-- Właściciel platformy (y_center = 1240) -->
  <g>
    <circle class="actor-head" cx="200" cy="1195" r="14"/>
    <line class="actor-line" x1="200" y1="1209" x2="200" y2="1265"/>
    <line class="actor-line" x1="170" y1="1225" x2="230" y2="1225"/>
    <line class="actor-line" x1="200" y1="1265" x2="175" y2="1305"/>
    <line class="actor-line" x1="200" y1="1265" x2="225" y2="1305"/>
    <text class="actor-label" x="200" y="1335">Właściciel platformy</text>
  </g>

  <!-- Użytkownik systemu (PARENT — abstract, top-left, rola: rodzic generalizacji) -->
  <g>
    <text class="actor-stereo" x="100" y="105">«abstract»</text>
    <circle class="actor-head" cx="100" cy="130" r="14"/>
    <line class="actor-line" x1="100" y1="144" x2="100" y2="200"/>
    <line class="actor-line" x1="70" y1="160" x2="130" y2="160"/>
    <line class="actor-line" x1="100" y1="200" x2="75" y2="240"/>
    <line class="actor-line" x1="100" y1="200" x2="125" y2="240"/>
    <text class="actor-label" x="100" y="270">Użytkownik</text>
    <text class="actor-label" x="100" y="290">systemu</text>
  </g>

  <!-- ================== AKTORZY (RIGHT SIDE) ================== -->
  <!-- System mailowy SMTP — secondary -->
  <g>
    <text class="actor-stereo" x="2050" y="195">«system»</text>
    <circle class="actor-head" cx="2050" cy="220" r="14"/>
    <line class="actor-line" x1="2050" y1="234" x2="2050" y2="290"/>
    <line class="actor-line" x1="2020" y1="250" x2="2080" y2="250"/>
    <line class="actor-line" x1="2050" y1="290" x2="2025" y2="330"/>
    <line class="actor-line" x1="2050" y1="290" x2="2075" y2="330"/>
    <text class="actor-label" x="2050" y="360">System mailowy</text>
    <text class="actor-label" x="2050" y="380">SMTP</text>
  </g>

  <!-- ================== GENERALIZACJA ================== -->
  <!-- Wspólna "szyna" generalizacji: każdy konkretny aktor → x=150 → góra → parent (100,310) -->
  <!-- pojedyncza linia od dołu parent (y=310) do dolnego aktora po szynie -->

  <!-- Główna pionowa szyna -->
  <line class="gen-line" x1="150" y1="310" x2="150" y2="1240"/>
  <!-- Krótki segment z parent (head bottom y=290) do szyny -->
  <path class="gen-line" d="M 100 290 L 100 310 L 150 310"/>

  <!-- "Odgałęzienia" do każdego konkretnego aktora — z hollow triangle u góry (kierunek: child → parent) -->
  <!-- Pracownik @ (200, 220 head) — linia z głowy actor w lewo do szyny -->
  <line class="gen-line" x1="186" y1="240" x2="150" y2="240"/>
  <!-- HR @ (200, 555 head) -->
  <line class="gen-line" x1="186" y1="555" x2="150" y2="555"/>
  <!-- Administrator firmy @ (200, 855 head) -->
  <line class="gen-line" x1="186" y1="855" x2="150" y2="855"/>
  <!-- Właściciel platformy @ (200, 1195 head) -->
  <line class="gen-line" x1="186" y1="1195" x2="150" y2="1195"/>

  <!-- Hollow triangle umieszczamy dokładnie u parent (na końcu szyny od strony parent). -->
  <!-- Symbol generalizacji w jednym miejscu — na styku odgałęzień -->
  <polygon points="150,310 138,326 162,326" fill="#fff" stroke="#5d50ad" stroke-width="1.5"/>

  <!-- ================== ASOCJACJE (aktor → use case) ================== -->

  <!-- ===== PRACOWNIK ===== -->
  <!-- actor right edge ~ 230, UC col A left edge x=560 -->
  <line class="assoc" x1="230" y1="290" x2="560" y2="220"/>
  <line class="assoc" x1="230" y1="290" x2="560" y2="300"/>
  <line class="assoc" x1="230" y1="290" x2="560" y2="380"/>
  <line class="assoc" x1="230" y1="290" x2="940" y2="220"/>
  <line class="assoc" x1="230" y1="290" x2="940" y2="300"/>
  <line class="assoc" x1="230" y1="290" x2="940" y2="380"/>

  <!-- ===== HR ===== -->
  <line class="assoc" x1="230" y1="600" x2="560" y2="560"/>
  <line class="assoc" x1="230" y1="600" x2="560" y2="640"/>
  <line class="assoc" x1="230" y1="600" x2="940" y2="560"/>
  <line class="assoc" x1="230" y1="600" x2="940" y2="640"/>
  <line class="assoc" x1="230" y1="600" x2="1320" y2="560"/>

  <!-- ===== ADMINISTRATOR FIRMY ===== -->
  <line class="assoc" x1="230" y1="900" x2="560" y2="830"/>
  <line class="assoc" x1="230" y1="900" x2="560" y2="910"/>
  <line class="assoc" x1="230" y1="900" x2="560" y2="990"/>
  <line class="assoc" x1="230" y1="900" x2="940" y2="830"/>
  <line class="assoc" x1="230" y1="900" x2="940" y2="910"/>
  <line class="assoc" x1="230" y1="900" x2="940" y2="990"/>

  <!-- ===== WŁAŚCICIEL PLATFORMY ===== -->
  <line class="assoc" x1="230" y1="1240" x2="560" y2="1170"/>
  <line class="assoc" x1="230" y1="1240" x2="560" y2="1250"/>
  <line class="assoc" x1="230" y1="1240" x2="560" y2="1340"/>
  <line class="assoc" x1="230" y1="1240" x2="940" y2="1170"/>
  <line class="assoc" x1="230" y1="1240" x2="940" y2="1250"/>
  <line class="assoc" x1="230" y1="1240" x2="940" y2="1340"/>

  <!-- ===== SMTP (right) — asocjacja do "Otrzymanie powiadomienia" ===== -->
  <line class="assoc" x1="2020" y1="290" x2="1260" y2="220"/>
  <!-- SMTP do "Zaproszenie pracownika" (admin wysyła zaproszenie) -->
  <path class="assoc" d="M 2050 390 L 2050 910 L 880 910"/>
  <!-- SMTP do "Akceptacja rejestracji firm" (super-admin → email) -->
  <path class="assoc" d="M 2050 390 L 2050 1250 L 880 1250" stroke-dasharray="0"/>

  <!-- ================== LEGENDA ================== -->
  <g transform="translate(1500, 1130)">
    <rect width="420" height="260" fill="#fafafa" stroke="#b8b8b8" stroke-width="1" rx="4"/>
    <rect width="420" height="36" fill="#b3d4f0" stroke="#b8b8b8" stroke-width="1" rx="4"/>
    <rect y="20" width="420" height="16" fill="#b3d4f0" stroke="#b8b8b8" stroke-width="0"/>
    <text x="210" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13pt" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Legenda</text>

    <!-- aktor -->
    <g transform="translate(20, 50)">
      <circle cx="14" cy="10" r="7" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="14" y1="17" x2="14" y2="40" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="4" y1="24" x2="24" y2="24" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="14" y1="40" x2="6" y2="56" stroke="#1a1a1a" stroke-width="1.5"/>
      <line x1="14" y1="40" x2="22" y2="56" stroke="#1a1a1a" stroke-width="1.5"/>
    </g>
    <text x="60" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11pt" fill="#1a1a1a">— aktor (rola w systemie)</text>

    <!-- use case -->
    <ellipse cx="34" cy="130" rx="32" ry="14" fill="#eaf2f9" stroke="#5d8cb6" stroke-width="1.5"/>
    <text x="34" y="134" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9pt" fill="#1a1a1a" text-anchor="middle">UC</text>
    <text x="80" y="134" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11pt" fill="#1a1a1a">— przypadek użycia (use case)</text>

    <!-- asocjacja -->
    <line x1="10" y1="170" x2="60" y2="170" class="assoc"/>
    <text x="80" y="174" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11pt" fill="#1a1a1a">— asocjacja aktor — UC</text>

    <!-- generalizacja -->
    <line x1="10" y1="200" x2="55" y2="200" class="gen-line" marker-end="url(#gen)"/>
    <text x="80" y="204" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11pt" fill="#1a1a1a">— generalizacja (dziedziczenie)</text>

    <!-- extend -->
    <line x1="10" y1="230" x2="55" y2="230" class="extend-line" marker-end="url(#arrow)"/>
    <text x="80" y="234" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11pt" fill="#1a1a1a">— relacja «extend»</text>
  </g>

</svg>

<p class="figure-caption">Rysunek 3.1 Diagram przypadków użycia aplikacji MoodFlow (źródło: opracowanie własne)</p>

</body>
</html>
