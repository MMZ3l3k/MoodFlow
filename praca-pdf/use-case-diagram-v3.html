<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Diagram przypadków użycia</title>
<style>
  body {
    font-family: Verdana, sans-serif;
    margin: 0;
    padding: 28px 32px;
    background: #fff;
  }
  .figure-caption {
    text-align: center;
    font-style: italic;
    font-size: 11pt;
    margin-top: 14px;
  }
  svg { display: block; margin: 0 auto; background: #fff; }

  .system-bg { fill: #B8D8E8; stroke: #5A8FA8; stroke-width: 2; }
  .system-label { font-family: Verdana, sans-serif; font-size: 13pt; font-weight: bold; fill: #1e3a4f; }

  .actor-line { stroke: #000; stroke-width: 1.8; fill: none; }
  .actor-label { font-family: Verdana, sans-serif; font-size: 11pt; text-anchor: middle; fill: #000; }

  .uc { fill: #fff; stroke: #000; stroke-width: 1.2; }
  .uc-text { font-family: Verdana, sans-serif; font-size: 9pt; text-anchor: middle; fill: #000; }
  .ext-divider { stroke: #000; stroke-width: 0.7; fill: none; }
  .ext-italic { font-family: Verdana, sans-serif; font-size: 7.5pt; text-anchor: middle; fill: #000; font-style: italic; }
  .ext-point { font-family: Verdana, sans-serif; font-size: 7.5pt; text-anchor: middle; fill: #000; }

  .conn { stroke: #000; stroke-width: 1; fill: none; }
  .conn-extend { stroke: #000; stroke-width: 1; stroke-dasharray: 6,3; fill: none; }
  .conn-include { stroke: #000; stroke-width: 1; stroke-dasharray: 6,3; fill: none; }
  .conn-label { font-family: Verdana, sans-serif; font-size: 9pt; fill: #000; font-style: italic; text-anchor: middle; }
</style>
</head>
<body>

<svg width="1900" height="1280" viewBox="0 0 1900 1280" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrowDash" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#000"/>
    </marker>
  </defs>

  <!-- ─── SYSTEM BOX ─── -->
  <rect class="system-bg" x="220" y="60" width="1460" height="1180" rx="4"/>
  <text class="system-label" x="240" y="88">Aplikacja MoodFlow</text>

  <!-- ─── AKTORZY LEWA STRONA ─── -->

  <g transform="translate(120, 220)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">Pracownik</text>
  </g>

  <g transform="translate(120, 1100)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">System</text>
    <text class="actor-label" x="0" y="118">mailowy SMTP</text>
  </g>

  <!-- ─── AKTORZY PRAWA STRONA ─── -->

  <g transform="translate(1780, 220)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">HR</text>
  </g>

  <g transform="translate(1780, 640)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">Administrator</text>
    <text class="actor-label" x="0" y="118">firmy</text>
  </g>

  <g transform="translate(1780, 1050)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">Właściciel</text>
    <text class="actor-label" x="0" y="118">platformy</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — WSPÓLNE (rząd 1, y=160) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <ellipse class="uc" cx="500" cy="160" rx="100" ry="32"/>
  <text class="uc-text" x="500" y="164">Logowanie</text>

  <ellipse class="uc" cx="950" cy="160" rx="100" ry="32"/>
  <text class="uc-text" x="950" y="164">Wylogowanie</text>

  <!-- Edytowanie profilu Z extension points -->
  <g>
    <ellipse class="uc" cx="1400" cy="170" rx="140" ry="52"/>
    <text class="uc-text" x="1400" y="148">Edytowanie profilu</text>
    <line class="ext-divider" x1="1268" y1="172" x2="1532" y2="172"/>
    <text class="ext-italic" x="1400" y="188">extension points</text>
    <text class="ext-point" x="1400" y="204">Zmiana hasła</text>
  </g>

  <!-- Zmiana hasła (jako rozszerzenie) -->
  <ellipse class="uc" cx="1400" cy="320" rx="100" ry="30"/>
  <text class="uc-text" x="1400" y="324">Zmiana hasła</text>

  <line class="conn-extend" x1="1400" y1="290" x2="1400" y2="222" marker-end="url(#arrowDash)"/>
  <text class="conn-label" x="1450" y="260">«extend»</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — PRACOWNIK (lewa kolumna, x=460) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <ellipse class="uc" cx="460" cy="280" rx="125" ry="32"/>
  <text class="uc-text" x="460" y="284">Wypełnienie testu</text>

  <ellipse class="uc" cx="460" cy="380" rx="125" ry="36"/>
  <text class="uc-text" x="460" y="376">Codzienny check-in</text>
  <text class="uc-text" x="460" y="390">nastroju (MOOD10)</text>

  <ellipse class="uc" cx="460" cy="490" rx="125" ry="36"/>
  <text class="uc-text" x="460" y="486">Przegląd własnych</text>
  <text class="uc-text" x="460" y="500">wyników i historii</text>

  <ellipse class="uc" cx="460" cy="600" rx="125" ry="36"/>
  <text class="uc-text" x="460" y="596">Wgląd we Wskaźnik</text>
  <text class="uc-text" x="460" y="610">Dobrostanu</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — ADMIN FIRMY (środkowa kolumna, x=950) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Przypisanie testu (z extension points) -->
  <g>
    <ellipse class="uc" cx="950" cy="380" rx="170" ry="55"/>
    <text class="uc-text" x="950" y="358">Przypisanie testu</text>
    <line class="ext-divider" x1="788" y1="382" x2="1112" y2="382"/>
    <text class="ext-italic" x="950" y="398">extension points</text>
    <text class="ext-point" x="950" y="414">Powiadomienie pracowników</text>
  </g>

  <ellipse class="uc" cx="950" cy="510" rx="140" ry="36"/>
  <text class="uc-text" x="950" y="506">Zatwierdzanie</text>
  <text class="uc-text" x="950" y="520">pracownika</text>

  <ellipse class="uc" cx="950" cy="620" rx="140" ry="36"/>
  <text class="uc-text" x="950" y="616">Zarządzanie strukturą</text>
  <text class="uc-text" x="950" y="630">organizacyjną firmy</text>

  <ellipse class="uc" cx="950" cy="730" rx="140" ry="36"/>
  <text class="uc-text" x="950" y="726">Przegląd dziennika</text>
  <text class="uc-text" x="950" y="740">audytu firmy</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — HR (prawa kolumna góra, x=1430) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <ellipse class="uc" cx="1430" cy="430" rx="135" ry="36"/>
  <text class="uc-text" x="1430" y="426">Przegląd panelu</text>
  <text class="uc-text" x="1430" y="440">analitycznego HR</text>

  <ellipse class="uc" cx="1430" cy="540" rx="135" ry="36"/>
  <text class="uc-text" x="1430" y="536">Filtrowanie raportów</text>
  <text class="uc-text" x="1430" y="550">(dział, czas, test)</text>

  <ellipse class="uc" cx="1430" cy="650" rx="135" ry="36"/>
  <text class="uc-text" x="1430" y="646">Analiza trendów</text>
  <text class="uc-text" x="1430" y="660">w czasie</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — POWIADOMIENIA (środek dolny, x=600) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <ellipse class="uc" cx="600" cy="900" rx="140" ry="36"/>
  <text class="uc-text" x="600" y="896">Powiadomienie</text>
  <text class="uc-text" x="600" y="910">in-app</text>

  <ellipse class="uc" cx="600" cy="1020" rx="140" ry="36"/>
  <text class="uc-text" x="600" y="1016">Wysłanie</text>
  <text class="uc-text" x="600" y="1030">e-maila</text>

  <!-- Strzałki «extend» od powiadomień do Przypisanie testu -->
  <line class="conn-extend" x1="600" y1="864" x2="850" y2="430" marker-end="url(#arrowDash)"/>
  <text class="conn-label" x="780" y="660">«extend»</text>

  <line class="conn-extend" x1="600" y1="984" x2="830" y2="430" marker-end="url(#arrowDash)"/>
  <text class="conn-label" x="700" y="780">«extend»</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — SUPER-ADMIN (prawa kolumna, x=1430, dół) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <ellipse class="uc" cx="1430" cy="900" rx="135" ry="36"/>
  <text class="uc-text" x="1430" y="896">Zatwierdzanie</text>
  <text class="uc-text" x="1430" y="910">nowej firmy</text>

  <ellipse class="uc" cx="1430" cy="1020" rx="135" ry="36"/>
  <text class="uc-text" x="1430" y="1024">Blokowanie firmy</text>

  <ellipse class="uc" cx="1430" cy="1140" rx="135" ry="36"/>
  <text class="uc-text" x="1430" y="1136">Globalny dziennik</text>
  <text class="uc-text" x="1430" y="1150">audytu platformy</text>

  <!-- ─────────────────────────────────────────────────────────────────── -->
  <!-- ASOCJACJE: PRACOWNIK -->
  <!-- ─────────────────────────────────────────────────────────────────── -->

  <!-- Pracownik → wspólne (Logowanie, Wylogowanie, Edytowanie profilu) -->
  <line class="conn" x1="155" y1="210" x2="402" y2="155"/>
  <line class="conn" x1="155" y1="220" x2="852" y2="155"/>
  <line class="conn" x1="155" y1="230" x2="1262" y2="160"/>

  <!-- Pracownik → swoje use case'y (lewa kolumna) -->
  <line class="conn" x1="155" y1="240" x2="338" y2="280"/>
  <line class="conn" x1="155" y1="250" x2="338" y2="380"/>
  <line class="conn" x1="155" y1="260" x2="338" y2="490"/>
  <line class="conn" x1="155" y1="270" x2="338" y2="600"/>

  <!-- ─────────────────────────────────────────────────────────────────── -->
  <!-- ASOCJACJE: HR -->
  <!-- ─────────────────────────────────────────────────────────────────── -->

  <!-- HR → wspólne (przez "korytarz" górny) -->
  <line class="conn" x1="1745" y1="210" x2="1538" y2="160"/>
  <line class="conn" x1="1745" y1="220" x2="1048" y2="155"/>
  <line class="conn" x1="1745" y1="230" x2="595" y2="155"/>

  <!-- HR → swoje use case'y (prawa kolumna) -->
  <line class="conn" x1="1745" y1="240" x2="1562" y2="430"/>
  <line class="conn" x1="1745" y1="250" x2="1562" y2="540"/>
  <line class="conn" x1="1745" y1="260" x2="1562" y2="650"/>

  <!-- ─────────────────────────────────────────────────────────────────── -->
  <!-- ASOCJACJE: ADMIN FIRMY -->
  <!-- ─────────────────────────────────────────────────────────────────── -->

  <!-- Admin firmy → wspólne (Logowanie, Wylogowanie, Edyt. profilu) -->
  <line class="conn" x1="1745" y1="630" x2="1540" y2="160"/>
  <line class="conn" x1="1745" y1="620" x2="1050" y2="160"/>
  <line class="conn" x1="1745" y1="610" x2="600" y2="160"/>

  <!-- Admin firmy → swoje use case'y (środek) -->
  <line class="conn" x1="1745" y1="640" x2="1118" y2="380"/>
  <line class="conn" x1="1745" y1="650" x2="1088" y2="510"/>
  <line class="conn" x1="1745" y1="660" x2="1088" y2="620"/>
  <line class="conn" x1="1745" y1="670" x2="1088" y2="730"/>

  <!-- Admin firmy → też ma dostęp do panelu HR (jak HR) -->
  <line class="conn" x1="1745" y1="680" x2="1562" y2="430"/>

  <!-- ─────────────────────────────────────────────────────────────────── -->
  <!-- ASOCJACJE: SUPER-ADMIN -->
  <!-- ─────────────────────────────────────────────────────────────────── -->

  <!-- Super-admin → wspólne -->
  <line class="conn" x1="1745" y1="1040" x2="1540" y2="180"/>
  <line class="conn" x1="1745" y1="1050" x2="1050" y2="170"/>
  <line class="conn" x1="1745" y1="1060" x2="600" y2="170"/>

  <!-- Super-admin → swoje use case'y (prawa kolumna dół) -->
  <line class="conn" x1="1745" y1="1070" x2="1562" y2="900"/>
  <line class="conn" x1="1745" y1="1080" x2="1562" y2="1020"/>
  <line class="conn" x1="1745" y1="1090" x2="1562" y2="1140"/>

  <!-- ─────────────────────────────────────────────────────────────────── -->
  <!-- ASOCJACJE: SYSTEM MAILOWY SMTP -->
  <!-- ─────────────────────────────────────────────────────────────────── -->

  <line class="conn" x1="155" y1="1090" x2="460" y2="1020"/>

  <!-- ─────────────────────────────────────────────────────────────────── -->
  <!-- ASOCJACJE: PRACOWNIK → POWIADOMIENIE IN-APP -->
  <!-- ─────────────────────────────────────────────────────────────────── -->

  <line class="conn" x1="155" y1="280" x2="460" y2="900"/>

</svg>

<p class="figure-caption">Rysunek 3.1 Diagram przypadków użycia aplikacji MoodFlow (źródło: opracowanie własne)</p>

</body>
</html>
