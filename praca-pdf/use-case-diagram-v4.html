<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Diagram przypadków użycia</title>
<style>
  body {
    font-family: Verdana, sans-serif;
    margin: 0;
    padding: 28px 32px;
    background: #fff;
  }
  .figure-caption {
    text-align: center;
    font-style: italic;
    font-size: 11pt;
    margin-top: 14px;
  }
  svg { display: block; margin: 0 auto; background: #fff; }

  .system-bg { fill: #B8D8E8; stroke: #5A8FA8; stroke-width: 2; }
  .system-label { font-family: Verdana, sans-serif; font-size: 13pt; font-weight: bold; fill: #1e3a4f; }

  .actor-line { stroke: #000; stroke-width: 1.8; fill: none; }
  .actor-label { font-family: Verdana, sans-serif; font-size: 11pt; text-anchor: middle; fill: #000; }

  .uc { fill: #fff; stroke: #000; stroke-width: 1.2; }
  .uc-text { font-family: Verdana, sans-serif; font-size: 9pt; text-anchor: middle; fill: #000; }
  .ext-divider { stroke: #000; stroke-width: 0.7; fill: none; }
  .ext-italic { font-family: Verdana, sans-serif; font-size: 7.5pt; text-anchor: middle; fill: #000; font-style: italic; }
  .ext-point { font-family: Verdana, sans-serif; font-size: 7.5pt; text-anchor: middle; fill: #000; }

  .conn { stroke: #000; stroke-width: 1; fill: none; }
  .conn-extend { stroke: #000; stroke-width: 1; stroke-dasharray: 6,3; fill: none; }
  .conn-gen { stroke: #000; stroke-width: 1.2; fill: none; }
  .conn-label { font-family: Verdana, sans-serif; font-size: 9pt; fill: #000; font-style: italic; text-anchor: middle; }
</style>
</head>
<body>

<svg width="1920" height="1280" viewBox="0 0 1920 1280" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrowDash" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#000"/>
    </marker>
    <!-- pusty trójkąt dla generalizacji -->
    <marker id="genArrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 z" fill="#fff" stroke="#000" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ─── SYSTEM BOX ─── -->
  <rect class="system-bg" x="220" y="60" width="1480" height="1180" rx="4"/>
  <text class="system-label" x="240" y="88">Aplikacja MoodFlow</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- AKTORZY -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Użytkownik (rodzic) — lewa, na górze -->
  <g transform="translate(120, 200)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">Użytkownik</text>
    <text class="actor-label" x="0" y="118">systemu</text>
  </g>

  <!-- Pracownik — lewa, środek -->
  <g transform="translate(120, 510)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">Pracownik</text>
  </g>

  <!-- System mailowy SMTP — lewa, dół -->
  <g transform="translate(120, 1080)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">System</text>
    <text class="actor-label" x="0" y="118">mailowy SMTP</text>
  </g>

  <!-- HR — prawa, góra -->
  <g transform="translate(1800, 320)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">HR</text>
  </g>

  <!-- Administrator firmy — prawa, środek -->
  <g transform="translate(1800, 700)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">Administrator</text>
    <text class="actor-label" x="0" y="118">firmy</text>
  </g>

  <!-- Właściciel platformy — prawa, dół -->
  <g transform="translate(1800, 1080)">
    <circle cx="0" cy="0" r="14" class="actor-line"/>
    <line x1="0" y1="14" x2="0" y2="50" class="actor-line"/>
    <line x1="-20" y1="28" x2="20" y2="28" class="actor-line"/>
    <line x1="0" y1="50" x2="-15" y2="78" class="actor-line"/>
    <line x1="0" y1="50" x2="15" y2="78" class="actor-line"/>
    <text class="actor-label" x="0" y="100">Właściciel</text>
    <text class="actor-label" x="0" y="118">platformy</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- GENERALIZACJE: konkretni aktorzy → Użytkownik systemu                -->
  <!-- (puste trójkątne strzałki pokazujące dziedziczenie)                  -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Pracownik → Użytkownik (krótka linia po lewej, bez przecięć) -->
  <line class="conn-gen" x1="120" y1="490" x2="120" y2="320" marker-end="url(#genArrow)"/>

  <!-- HR → Użytkownik -->
  <path class="conn-gen" d="M 1780 310 L 80 310 L 80 305" marker-end="url(#genArrow)" fill="none"/>

  <!-- Admin firmy → Użytkownik -->
  <path class="conn-gen" d="M 1780 690 L 70 690 L 70 310" marker-end="url(#genArrow)" fill="none"/>

  <!-- Super-admin → Użytkownik -->
  <path class="conn-gen" d="M 1780 1070 L 60 1070 L 60 315" marker-end="url(#genArrow)" fill="none"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — WSPÓLNE (obok Użytkownika, lewa-górna część systemu)    -->
  <!-- Łączone tylko z aktorem "Użytkownik systemu"                        -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <ellipse class="uc" cx="370" cy="160" rx="100" ry="30"/>
  <text class="uc-text" x="370" y="164">Logowanie</text>

  <ellipse class="uc" cx="370" cy="240" rx="100" ry="30"/>
  <text class="uc-text" x="370" y="244">Wylogowanie</text>

  <!-- Edytowanie profilu z extension point -->
  <g>
    <ellipse class="uc" cx="370" cy="340" rx="120" ry="50"/>
    <text class="uc-text" x="370" y="320">Edytowanie profilu</text>
    <line class="ext-divider" x1="258" y1="342" x2="482" y2="342"/>
    <text class="ext-italic" x="370" y="358">extension points</text>
    <text class="ext-point" x="370" y="372">Zmiana hasła</text>
  </g>

  <!-- Zmiana hasła (osobny UC z «extend») -->
  <ellipse class="uc" cx="660" cy="340" rx="90" ry="28"/>
  <text class="uc-text" x="660" y="344">Zmiana hasła</text>
  <line class="conn-extend" x1="570" y1="340" x2="490" y2="340" marker-end="url(#arrowDash)"/>
  <text class="conn-label" x="530" y="332">«extend»</text>

  <!-- Asocjacje Użytkownik → 3 wspólne UC (krótkie linie) -->
  <line class="conn" x1="155" y1="180" x2="270" y2="160"/>
  <line class="conn" x1="155" y1="200" x2="270" y2="240"/>
  <line class="conn" x1="155" y1="220" x2="250" y2="340"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — PRACOWNIK (kolumna obok niego)                          -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <ellipse class="uc" cx="450" cy="490" rx="125" ry="32"/>
  <text class="uc-text" x="450" y="494">Wypełnienie testu</text>

  <ellipse class="uc" cx="450" cy="570" rx="125" ry="36"/>
  <text class="uc-text" x="450" y="566">Codzienny check-in</text>
  <text class="uc-text" x="450" y="580">nastroju (MOOD10)</text>

  <ellipse class="uc" cx="450" cy="660" rx="125" ry="36"/>
  <text class="uc-text" x="450" y="656">Przegląd własnych</text>
  <text class="uc-text" x="450" y="670">wyników i historii</text>

  <ellipse class="uc" cx="450" cy="750" rx="125" ry="36"/>
  <text class="uc-text" x="450" y="746">Wgląd we Wskaźnik</text>
  <text class="uc-text" x="450" y="760">Dobrostanu</text>

  <!-- Asocjacje Pracownik → 4 swoje UC -->
  <line class="conn" x1="155" y1="500" x2="325" y2="490"/>
  <line class="conn" x1="155" y1="510" x2="325" y2="570"/>
  <line class="conn" x1="155" y1="520" x2="325" y2="660"/>
  <line class="conn" x1="155" y1="530" x2="325" y2="750"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — POWIADOMIENIA (lewa-dolna część)                        -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <ellipse class="uc" cx="450" cy="900" rx="125" ry="32"/>
  <text class="uc-text" x="450" y="904">Powiadomienie in-app</text>

  <ellipse class="uc" cx="450" cy="1080" rx="125" ry="32"/>
  <text class="uc-text" x="450" y="1084">Wysłanie e-maila</text>

  <!-- System SMTP → Wysłanie e-maila (asocjacja) -->
  <line class="conn" x1="155" y1="1080" x2="325" y2="1080"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — HR (prawa, góra)                                        -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <ellipse class="uc" cx="1530" cy="280" rx="135" ry="36"/>
  <text class="uc-text" x="1530" y="276">Przegląd panelu</text>
  <text class="uc-text" x="1530" y="290">analitycznego HR</text>

  <ellipse class="uc" cx="1530" cy="370" rx="135" ry="36"/>
  <text class="uc-text" x="1530" y="366">Filtrowanie raportów</text>
  <text class="uc-text" x="1530" y="380">(dział, czas, test)</text>

  <ellipse class="uc" cx="1530" cy="460" rx="135" ry="36"/>
  <text class="uc-text" x="1530" y="456">Analiza trendów</text>
  <text class="uc-text" x="1530" y="470">w czasie</text>

  <!-- HR → 3 swoje UC -->
  <line class="conn" x1="1765" y1="310" x2="1665" y2="280"/>
  <line class="conn" x1="1765" y1="320" x2="1665" y2="370"/>
  <line class="conn" x1="1765" y1="330" x2="1665" y2="460"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — ADMIN FIRMY (prawa, środek)                             -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Przypisanie testu z extension points -->
  <g>
    <ellipse class="uc" cx="1530" cy="600" rx="160" ry="55"/>
    <text class="uc-text" x="1530" y="578">Przypisanie testu</text>
    <line class="ext-divider" x1="1378" y1="602" x2="1682" y2="602"/>
    <text class="ext-italic" x="1530" y="618">extension points</text>
    <text class="ext-point" x="1530" y="634">Powiadomienie pracowników</text>
  </g>

  <ellipse class="uc" cx="1530" cy="720" rx="140" ry="36"/>
  <text class="uc-text" x="1530" y="716">Zatwierdzanie</text>
  <text class="uc-text" x="1530" y="730">pracownika</text>

  <ellipse class="uc" cx="1530" cy="810" rx="140" ry="36"/>
  <text class="uc-text" x="1530" y="806">Zarządzanie strukturą</text>
  <text class="uc-text" x="1530" y="820">organizacyjną firmy</text>

  <ellipse class="uc" cx="1530" cy="900" rx="140" ry="36"/>
  <text class="uc-text" x="1530" y="896">Przegląd dziennika</text>
  <text class="uc-text" x="1530" y="910">audytu firmy</text>

  <!-- Admin firmy → swoje UC -->
  <line class="conn" x1="1765" y1="690" x2="1690" y2="600"/>
  <line class="conn" x1="1765" y1="700" x2="1670" y2="720"/>
  <line class="conn" x1="1765" y1="710" x2="1670" y2="810"/>
  <line class="conn" x1="1765" y1="720" x2="1670" y2="900"/>

  <!-- Admin firmy → też ma dostęp do panelu HR -->
  <line class="conn" x1="1765" y1="680" x2="1665" y2="280"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- USE CASES — SUPER-ADMIN (prawa, dół)                                -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <ellipse class="uc" cx="1530" cy="1020" rx="135" ry="36"/>
  <text class="uc-text" x="1530" y="1016">Zatwierdzanie</text>
  <text class="uc-text" x="1530" y="1030">nowej firmy</text>

  <ellipse class="uc" cx="1530" cy="1110" rx="135" ry="36"/>
  <text class="uc-text" x="1530" y="1114">Blokowanie firmy</text>

  <ellipse class="uc" cx="1530" cy="1200" rx="135" ry="36"/>
  <text class="uc-text" x="1530" y="1196">Globalny dziennik</text>
  <text class="uc-text" x="1530" y="1210">audytu platformy</text>

  <!-- Super-admin → swoje UC -->
  <line class="conn" x1="1765" y1="1070" x2="1665" y2="1020"/>
  <line class="conn" x1="1765" y1="1080" x2="1665" y2="1110"/>
  <line class="conn" x1="1765" y1="1090" x2="1665" y2="1200"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- EXTEND RELATIONSHIPS (Powiadomienia → Przypisanie testu)             -->
  <!-- Linie biegną dolnym pasem żeby nie przecinać UC                     -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Powiadomienie in-app «extend» Przypisanie testu -->
  <path class="conn-extend" d="M 575 900 Q 800 950, 1370 620" marker-end="url(#arrowDash)" fill="none"/>
  <text class="conn-label" x="900" y="970">«extend»</text>

  <!-- Wysłanie e-maila «extend» Przypisanie testu -->
  <path class="conn-extend" d="M 575 1080 Q 950 1120, 1370 640" marker-end="url(#arrowDash)" fill="none"/>
  <text class="conn-label" x="950" y="1150">«extend»</text>

  <!-- Pracownik «odbiera» Powiadomienie in-app -->
  <path class="conn" d="M 110 540 Q 80 720, 325 900" fill="none"/>

</svg>

<p class="figure-caption">Rysunek 3.1 Diagram przypadków użycia aplikacji MoodFlow (źródło: opracowanie własne)</p>

</body>
</html>
