server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # H2/M12: nagłówki bezpieczeństwa. CSP w trybie Report-Only — nie blokuje
    # aplikacji, tylko raportuje naruszenia do konsoli; docelowo przełączyć na
    # enforcing (Content-Security-Policy) po potwierdzeniu braku naruszeń.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://moodflow-production.up.railway.app; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Service worker — brak cache
    location = /sw.js {
        add_header Cache-Control "no-cache";
        proxy_cache_bypass $http_pragma;
        proxy_cache_revalidate on;
        expires off;
        access_log off;
    }

    # SPA fallback — wszystkie trasy do index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statyczne pliki — długi cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
